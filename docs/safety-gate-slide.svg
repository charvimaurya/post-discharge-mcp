<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The safety gate</title>
  <defs>
    <style>
      .ti{font-family:Georgia, 'Times New Roman', serif;font-weight:700;fill:#1E2B45}
      .cd{fill:#FFFFFF;stroke:#EADFD6;stroke-width:2}
      .rb{font-size:15px;font-weight:700;fill:#FFFFFF;letter-spacing:2.5}
      .nm{font-family:Georgia, serif;font-size:29px;font-weight:700;fill:#2A2420}
      .sub{font-family:Georgia, serif;font-size:19px;fill:#5A524C}
      .gl{fill:#E6E8EC}
      .q{font-family:Georgia, serif;font-size:21px;fill:#2A2420}
      .oc{font-size:23px;font-weight:700;fill:#2A2420}
      .pf{font-size:14px;fill:#6A625C;font-family:Consolas, Menlo, monospace}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#F7F3EE"/>

  <!-- Header -->
  <rect width="1920" height="82" fill="#A3204A"/>
  <rect x="42" y="14" width="54" height="54" rx="11" fill="#FFFFFF"/>
  <path d="M55 54 h28 M60 54 v-10 a9 9 0 0 1 18 0 v10 M69 30 v-6 M57 34 l-4 -4 M81 34 l4 -4" stroke="#A3204A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="110" y="56" fill="#FFFFFF" font-size="40" font-family="Georgia, serif">AfterWard</text>
  <rect x="1568" y="16" width="306" height="50" rx="25" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="1600" cy="41" r="7" fill="#FFFFFF"/>
  <text x="1620" y="48" fill="#FFFFFF" font-size="19" font-weight="700" letter-spacing="3">SIMULATED ALEXA+</text>

  <text x="38" y="132" font-size="19" font-weight="700" fill="#A3204A" letter-spacing="3">THE SAFETY GATE</text>
  <text x="38" y="190" class="ti" font-size="50">Four kinds of unclear line. Four tested rules.</text>
  <text x="38" y="226" font-size="19" fill="#4A423C">Every rule below has a test in the repo you can run with <tspan font-family="Consolas, Menlo, monospace" font-weight="700">pytest</tspan>. Nothing unclear is treated as fact.</text>

  <!-- Card template positions: x = 38, 508, 978, 1448 ; width 434 -->
  <!-- Card 1 -->
  <g>
    <rect x="38" y="252" width="434" height="610" rx="22" class="cd"/>
    <rect x="60" y="274" width="390" height="44" rx="8" fill="#A3204A"/>
    <text x="255" y="303" text-anchor="middle" class="rb">DEMO LETTER</text>
    <rect x="60" y="318" width="390" height="352" fill="#FFFFFF" stroke="#E6DDD3"/>
    <text x="96" y="368" class="nm">Margaret</text>
    <text x="96" y="398" class="sub">Knee replacement</text>
    <rect x="96" y="420" width="318" height="8" rx="4" class="gl"/><rect x="96" y="440" width="260" height="8" rx="4" class="gl"/><rect x="96" y="460" width="290" height="8" rx="4" class="gl"/>
    <rect x="88" y="484" width="334" height="88" rx="6" fill="#FBE6EC"/><rect x="88" y="484" width="5" height="88" fill="#A3204A"/>
    <text x="106" y="520" class="q">Apixaban: "Continue as</text><text x="106" y="550" class="q">directed."</text>
    <rect x="96" y="596" width="318" height="8" rx="4" class="gl"/><rect x="96" y="616" width="230" height="8" rx="4" class="gl"/><rect x="96" y="636" width="270" height="8" rx="4" class="gl"/>
    <rect x="60" y="694" width="190" height="38" rx="19" fill="#FBEBC9"/>
    <text x="78" y="719" font-size="17" font-weight="700" fill="#8A5A12">⚠  No end date</text>
    <text x="60" y="772" class="oc">Kept in the plan. No end</text>
    <text x="60" y="802" class="oc">date is ever made up</text>
    <text x="60" y="838" class="pf">test_data/letter1_margaret…pdf</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="508" y="252" width="434" height="610" rx="22" class="cd"/>
    <rect x="530" y="274" width="390" height="44" rx="8" fill="#A3204A"/>
    <text x="725" y="303" text-anchor="middle" class="rb">TEST CASE</text>
    <rect x="530" y="318" width="390" height="352" fill="#FFFFFF" stroke="#E6DDD3"/>
    <text x="566" y="368" class="nm">Unreadable word</text>
    <text x="566" y="398" class="sub">The model marks what it cannot read</text>
    <rect x="566" y="420" width="318" height="8" rx="4" class="gl"/><rect x="566" y="440" width="260" height="8" rx="4" class="gl"/><rect x="566" y="460" width="290" height="8" rx="4" class="gl"/>
    <rect x="558" y="484" width="334" height="88" rx="6" fill="#FBE6EC"/><rect x="558" y="484" width="5" height="88" fill="#A3204A"/>
    <text x="576" y="520" class="q">Dose: "[unreadable]"</text><text x="576" y="550" class="q">or "2 [?] tablets"</text>
    <rect x="566" y="596" width="318" height="8" rx="4" class="gl"/><rect x="566" y="616" width="230" height="8" rx="4" class="gl"/><rect x="566" y="636" width="270" height="8" rx="4" class="gl"/>
    <rect x="530" y="694" width="190" height="38" rx="19" fill="#FBE6EC"/>
    <text x="548" y="719" font-size="17" font-weight="700" fill="#A3204A">⚠  Unreadable</text>
    <text x="530" y="772" class="oc">Flagged for a person</text>
    <text x="530" y="802" class="oc">to confirm</text>
    <text x="530" y="838" class="pf">tests/ingestion/test_validator.py</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="978" y="252" width="434" height="610" rx="22" class="cd"/>
    <rect x="1000" y="274" width="390" height="44" rx="8" fill="#A3204A"/>
    <text x="1195" y="303" text-anchor="middle" class="rb">TEST CASE</text>
    <rect x="1000" y="318" width="390" height="352" fill="#FFFFFF" stroke="#E6DDD3"/>
    <text x="1036" y="368" class="nm">Two review dates</text>
    <text x="1036" y="398" class="sub">The letter disagrees with itself</text>
    <rect x="1036" y="420" width="318" height="8" rx="4" class="gl"/><rect x="1036" y="440" width="260" height="8" rx="4" class="gl"/><rect x="1036" y="460" width="290" height="8" rx="4" class="gl"/>
    <rect x="1028" y="484" width="334" height="88" rx="6" fill="#FBE6EC"/><rect x="1028" y="484" width="5" height="88" fill="#A3204A"/>
    <text x="1046" y="520" class="q">Review on 10 October;</text><text x="1046" y="550" class="q">also listed as 12 October</text>
    <rect x="1036" y="596" width="318" height="8" rx="4" class="gl"/><rect x="1036" y="616" width="230" height="8" rx="4" class="gl"/><rect x="1036" y="636" width="270" height="8" rx="4" class="gl"/>
    <rect x="1000" y="694" width="190" height="38" rx="19" fill="#FBE6EC"/>
    <text x="1018" y="719" font-size="17" font-weight="700" fill="#A3204A">⚠  Two dates</text>
    <text x="1000" y="772" class="oc">Both dates kept and</text>
    <text x="1000" y="802" class="oc">flagged. None is picked</text>
    <text x="1000" y="838" class="pf">tests/ingestion/test_extraction_scenarios.py</text>
  </g>

  <!-- Card 4 -->
  <g>
    <rect x="1448" y="252" width="434" height="610" rx="22" class="cd"/>
    <rect x="1470" y="274" width="390" height="44" rx="8" fill="#A3204A"/>
    <text x="1665" y="303" text-anchor="middle" class="rb">TEST CASE</text>
    <rect x="1470" y="318" width="390" height="352" fill="#FFFFFF" stroke="#E6DDD3"/>
    <text x="1506" y="368" class="nm">No dose given</text>
    <text x="1506" y="398" class="sub">Strength stated, amount missing</text>
    <rect x="1506" y="420" width="318" height="8" rx="4" class="gl"/><rect x="1506" y="440" width="260" height="8" rx="4" class="gl"/><rect x="1506" y="460" width="290" height="8" rx="4" class="gl"/>
    <rect x="1498" y="484" width="334" height="88" rx="6" fill="#FBE6EC"/><rect x="1498" y="484" width="5" height="88" fill="#A3204A"/>
    <text x="1516" y="520" class="q">"Amoxicillin 500 mg"</text><text x="1516" y="550" class="q">(no amount per dose)</text>
    <rect x="1506" y="596" width="318" height="8" rx="4" class="gl"/><rect x="1506" y="616" width="230" height="8" rx="4" class="gl"/><rect x="1506" y="636" width="270" height="8" rx="4" class="gl"/>
    <rect x="1470" y="694" width="160" height="38" rx="19" fill="#FBE6EC"/>
    <text x="1488" y="719" font-size="17" font-weight="700" fill="#A3204A">⚠  No dose</text>
    <text x="1470" y="772" class="oc">Dose left blank.</text>
    <text x="1470" y="802" class="oc">Never invented</text>
    <text x="1470" y="838" class="pf">tests/ingestion/test_phase4.py</text>
  </g>

  <!-- Open source pill -->
  <rect x="438" y="890" width="1044" height="78" rx="39" fill="#1E2430"/>
  <text x="960" y="940" text-anchor="middle" font-size="27" fill="#FFFFFF" font-weight="700">Open source:  <tspan font-family="Consolas, Menlo, monospace" fill="#F7A8C0">discharge-letter-check</tspan>  <tspan font-size="21" font-weight="400" fill="#C9CED8">· MIT · v0.1.0 · 149 tests</tspan></text>
  <rect x="1496" y="904" width="330" height="50" rx="25" fill="#E3F3EA" stroke="#1E7B4F" stroke-width="2"/>
  <text x="1661" y="936" text-anchor="middle" font-size="16" font-weight="700" fill="#1E7B4F" letter-spacing="1.2">✓ OPEN SOURCE CHALLENGE</text>
  <text x="960" y="1000" text-anchor="middle" font-size="18" fill="#6A625C" font-family="Consolas, Menlo, monospace">github.com/charvimaurya/discharge-letter-check</text>

  <!-- Footer -->
  <rect y="1022" width="1920" height="58" fill="#A3204A"/>
  <text x="44" y="1059" fill="#FFFFFF" font-size="19" font-weight="700" letter-spacing="1">AfterWard · A living recovery plan for Alexa+</text>
  <text x="1876" y="1059" text-anchor="end" fill="#F2C14E" font-size="19" font-weight="700" letter-spacing="1">Synthetic patient data · Simulated Alexa+</text>
</svg>
