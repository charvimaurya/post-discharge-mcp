<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">AfterWard architecture</title>
  <desc id="desc">Upload flows through S3 and SQS to Lambda processing with Bedrock, which saves a plan in DynamoDB and searchable passages in S3 Vectors. The interface uses a Bedrock agent and MCP tools to access the plan and search. EventBridge Scheduler invokes reminder Lambda to save pending check-ins in DynamoDB.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs>
  <rect width="1000" height="410" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="500" y="32" font-size="22" font-weight="bold">AfterWard: letter, plan, answers, and reminders</text>
    <g fill="#e0f2fe" stroke="#0284c7">
      <rect x="20" y="70" width="120" height="65" rx="8"/><rect x="170" y="70" width="110" height="65" rx="8"/><rect x="310" y="70" width="110" height="65" rx="8"/><rect x="450" y="70" width="210" height="65" rx="8"/>
      <rect x="760" y="70" width="210" height="65" rx="8"/><rect x="760" y="185" width="210" height="65" rx="8"/>
      <rect x="20" y="185" width="150" height="65" rx="8"/><rect x="220" y="185" width="190" height="65" rx="8"/><rect x="460" y="185" width="190" height="65" rx="8"/>
      <rect x="450" y="315" width="210" height="65" rx="8"/><rect x="760" y="315" width="210" height="65" rx="8"/>
    </g>
    <g font-size="16">
      <text x="80" y="109">Upload</text><text x="225" y="109">S3</text><text x="365" y="109">SQS</text>
      <text x="555" y="98">Lambda processor</text><text x="555" y="121">Bedrock extraction</text>
      <text x="865" y="98">DynamoDB</text><text x="865" y="121">Plan and progress</text>
      <text x="865" y="213">S3 Vectors</text><text x="865" y="236">Letter search</text>
      <text x="95" y="224">Interface</text><text x="315" y="224">Bedrock agent</text><text x="555" y="224">MCP server tools</text>
      <text x="555" y="343">EventBridge Scheduler</text><text x="555" y="366">Every five minutes</text>
      <text x="865" y="343">Reminder Lambda</text><text x="865" y="366">Pending check-ins</text>
    </g>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M140 102H168"/><path d="M280 102H308"/><path d="M420 102H448"/><path d="M660 102H758"/>
    <path d="M660 115H710V217H758"/><path d="M170 217H218"/><path d="M410 217H458"/>
    <path d="M650 202H690V145H865V137"/><path d="M650 232H758"/>
    <path d="M660 347H758"/><path d="M970 347H988V102H972"/>
  </g>
</svg>
