<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How AfterWard works</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A3204A"/></marker>
    <style>
      .ti{font-family:Georgia, 'Times New Roman', serif;font-weight:700;fill:#1E2B45}
      .pn{fill:#FFFFFF;stroke:#EADFD6;stroke-width:2}
      .bx{fill:#F3EEE8;stroke:#E6DDD3;stroke-width:1.5}
      .hot{fill:#FBE6EC;stroke:#A3204A;stroke-width:2.5}
      .bt{font-size:23px;font-weight:700;fill:#2A2420}
      .bh{font-size:23px;font-weight:700;fill:#A3204A}
      .bs{font-size:18.5px;fill:#4A423C}
      .chip{fill:#E3F3EA;stroke:#1E7B4F;stroke-width:1.5}
      .ct{font-size:13px;font-weight:700;fill:#1E7B4F;letter-spacing:1.2}
      .ar{stroke:#A3204A;stroke-width:2.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#F7F3EE"/>

  <!-- Header -->
  <rect width="1920" height="82" fill="#A3204A"/>
  <rect x="42" y="14" width="54" height="54" rx="11" fill="#FFFFFF"/>
  <path d="M55 54 h28 M60 54 v-10 a9 9 0 0 1 18 0 v10 M69 30 v-6 M57 34 l-4 -4 M81 34 l4 -4" stroke="#A3204A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="110" y="56" fill="#FFFFFF" font-size="40" font-family="Georgia, serif">AfterWard</text>
  <rect x="1568" y="16" width="306" height="50" rx="25" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="1600" cy="41" r="7" fill="#FFFFFF"/>
  <text x="1620" y="48" fill="#FFFFFF" font-size="19" font-weight="700" letter-spacing="3">SIMULATED ALEXA+</text>

  <text x="44" y="132" font-size="19" font-weight="700" fill="#A3204A" letter-spacing="3">BUILT ON AWS · EU-WEST-2</text>
  <text x="44" y="196" class="ti" font-size="58">How AfterWard works</text>
  <text x="1876" y="196" text-anchor="end" font-size="17" fill="#1E7B4F" font-weight="700">✓ green tags = hackathon requirement met</text>

  <!-- ===== Panel 1 ===== -->
  <rect x="44" y="226" width="590" height="660" rx="22" class="pn"/>
  <circle cx="88" cy="276" r="21" fill="#A3204A"/><text x="88" y="284" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="700">1</text>
  <text x="122" y="288" class="ti" font-size="32">A letter becomes a plan</text>

  <rect x="72" y="316" width="534" height="92" rx="12" class="bx"/>
  <text x="96" y="352" class="bt">Amazon S3</text>
  <text x="96" y="384" class="bs">Private, encrypted bucket for the uploaded letter</text>
  <path class="ar" d="M339 410 V436"/>
  <rect x="72" y="444" width="534" height="92" rx="12" class="bx"/>
  <text x="96" y="480" class="bt">Amazon SQS</text>
  <text x="96" y="512" class="bs">Queue, with a dead-letter queue and alarm</text>
  <path class="ar" d="M339 538 V564"/>
  <rect x="72" y="572" width="534" height="116" rx="12" class="bx"/>
  <text x="96" y="608" class="bt">AWS Lambda</text>
  <text x="96" y="640" class="bs">Reads the letter's text, then Claude on</text>
  <text x="96" y="666" class="bs">Amazon Bedrock fills in a fixed form</text>
  <path class="ar" d="M339 690 V716"/>
  <rect x="72" y="724" width="534" height="138" rx="12" class="hot"/>
  <text x="96" y="762" class="bh">Safety gate · open source</text>
  <text x="96" y="796" font-size="18.5" fill="#2A2420" font-family="Consolas, Menlo, monospace" font-weight="700">discharge-letter-check (MIT)</text>
  <text x="96" y="828" class="bs">Flags unclear items for a person to confirm</text>
  <rect x="438" y="738" width="154" height="28" rx="14" class="chip"/><text x="515" y="757" text-anchor="middle" class="ct">✓ OPEN SOURCE</text>

  <!-- ===== Panel 2 ===== -->
  <rect x="665" y="226" width="590" height="660" rx="22" class="pn"/>
  <circle cx="709" cy="276" r="21" fill="#A3204A"/><text x="709" y="284" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="700">2</text>
  <text x="743" y="288" class="ti" font-size="32">She talks to her plan</text>

  <rect x="693" y="316" width="534" height="116" rx="12" class="bx"/>
  <text x="717" y="352" class="bt">Simulated Alexa+ client</text>
  <text x="717" y="384" class="bs">Next.js · voice in, voice out</text>
  <text x="717" y="410" class="bs">plus an Alexa skill in Amazon's simulator</text>
  <rect x="1005" y="330" width="210" height="28" rx="14" class="chip"/><text x="1110" y="349" text-anchor="middle" class="ct">✓ SIMULATED ALEXA+</text>
  <path class="ar" d="M960 434 V460"/>
  <rect x="693" y="468" width="534" height="116" rx="12" class="bx"/>
  <text x="717" y="504" class="bt">Agent</text>
  <text x="717" y="536" class="bs">Crisis check first: a fixed safe reply, no AI</text>
  <text x="717" y="562" class="bs">Then Claude on Amazon Bedrock picks a tool</text>
  <path class="ar" d="M960 586 V612"/>
  <rect x="693" y="620" width="534" height="116" rx="12" class="hot"/>
  <text x="717" y="656" class="bh">AfterWard MCP server</text>
  <text x="717" y="688" class="bs">Amazon ECS on Fargate, behind ALB + CloudFront</text>
  <text x="717" y="714" class="bs">Streamable HTTP · spec 2025-11-25</text>
  <rect x="1005" y="634" width="210" height="28" rx="14" class="chip"/><text x="1110" y="653" text-anchor="middle" class="ct">✓ SELF-HOSTED MCP</text>
  <path class="ar" d="M960 738 V748"/>
  <rect x="693" y="754" width="534" height="108" rx="12" class="bx"/>
  <text x="717" y="786" class="bt">Nine tools, one patient</text>
  <text x="717" y="815" font-size="16.5" fill="#4A423C">6 read: today, week, a day, medicines, plan, her letter</text>
  <text x="717" y="841" font-size="16.5" fill="#4A423C">3 write: task done, medicine taken, undo · 2 prompts · MCP App</text>

  <!-- ===== Panel 3 ===== -->
  <rect x="1286" y="226" width="590" height="660" rx="22" class="pn"/>
  <circle cx="1330" cy="276" r="21" fill="#A3204A"/><text x="1330" y="284" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="700">3</text>
  <text x="1364" y="288" class="ti" font-size="32">AfterWard speaks first</text>

  <rect x="1314" y="316" width="534" height="92" rx="12" class="bx"/>
  <text x="1338" y="352" class="bt">Amazon EventBridge Scheduler</text>
  <text x="1338" y="384" class="bs">Runs the reminder check every 5 minutes</text>
  <path class="ar" d="M1581 410 V436"/>
  <rect x="1314" y="444" width="534" height="92" rx="12" class="bx"/>
  <text x="1338" y="480" class="bt">AWS Lambda</text>
  <text x="1338" y="512" class="bs">Finds what is due in the next 30 minutes</text>
  <path class="ar" d="M1581 538 V564"/>
  <rect x="1314" y="572" width="534" height="116" rx="12" class="bx"/>
  <text x="1338" y="608" class="bt">Pending reminder</text>
  <text x="1338" y="640" class="bs">The client speaks it out loud, unasked.</text>
  <text x="1338" y="666" class="bs">Reminder text is built by code, not the model</text>
  <path class="ar" d="M1581 690 V716"/>
  <rect x="1314" y="724" width="534" height="138" rx="12" class="bx"/>
  <text x="1338" y="762" class="bt">She answers</text>
  <text x="1338" y="796" class="bs">"I'm back from my walk" ticks the walk off,</text>
  <text x="1338" y="822" class="bs">saved in her event history</text>

  <!-- ===== Data strip ===== -->
  <rect x="44" y="906" width="1832" height="98" rx="18" class="pn"/>
  <rect x="78" y="944" width="18" height="16" rx="3" fill="none" stroke="#1F5A96" stroke-width="2.5"/>
  <path d="M81 944 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke="#1F5A96" stroke-width="2.5"/>
  <text x="112" y="962" font-size="23" font-weight="700" fill="#2A2420">Kept per patient</text>
  <rect x="330" y="920" width="520" height="70" rx="12" fill="#E8EFF7" stroke="#C9D7E8" stroke-width="1.5"/>
  <text x="352" y="950" font-size="22" font-weight="700" fill="#1F5A96">Amazon DynamoDB</text>
  <text x="352" y="977" class="bs">Recovery plan · event history</text>
  <rect x="870" y="920" width="560" height="70" rx="12" fill="#E8EFF7" stroke="#C9D7E8" stroke-width="1.5"/>
  <text x="892" y="950" font-size="22" font-weight="700" fill="#1F5A96">Amazon S3 Vectors</text>
  <text x="892" y="977" class="bs">Her own letter · Titan Text Embeddings V2</text>
  <rect x="1450" y="920" width="410" height="70" rx="12" class="chip"/>
  <text x="1472" y="950" font-size="18" font-weight="700" fill="#1E7B4F">✓ AWS BUILDER</text>
  <text x="1472" y="977" font-size="16.5" fill="#1E5A3A">14 AWS services, each documented</text>

  <!-- Footer -->
  <rect y="1022" width="1920" height="58" fill="#A3204A"/>
  <text x="44" y="1059" fill="#FFFFFF" font-size="19" font-weight="700" letter-spacing="1">AfterWard · A living recovery plan for Alexa+</text>
  <text x="1876" y="1059" text-anchor="end" fill="#F2C14E" font-size="19" font-weight="700" letter-spacing="1">Synthetic patient data · Simulated Alexa+</text>
</svg>
