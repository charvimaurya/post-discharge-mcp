<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The MVP</title>
  <defs>
    <style>
      .ti{font-family:Georgia, 'Times New Roman', serif;font-weight:700}
      .dw{font-size:20px;fill:#FFFFFF}
      .sm{font-size:20px;fill:#2A2420}
      .nx{font-size:18.5px;fill:#2A2420}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Header -->
  <rect width="1920" height="82" fill="#A3204A"/>
  <rect x="42" y="14" width="54" height="54" rx="11" fill="#FFFFFF"/>
  <path d="M55 54 h28 M60 54 v-10 a9 9 0 0 1 18 0 v10 M69 30 v-6 M57 34 l-4 -4 M81 34 l4 -4" stroke="#A3204A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="110" y="56" fill="#FFFFFF" font-size="40" font-family="Georgia, serif">AfterWard</text>
  <rect x="1568" y="16" width="306" height="50" rx="25" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="1600" cy="41" r="7" fill="#FFFFFF"/>
  <text x="1620" y="48" fill="#FFFFFF" font-size="19" font-weight="700" letter-spacing="3">SIMULATED ALEXA+</text>

  <text x="44" y="132" font-size="19" font-weight="700" fill="#A3204A" letter-spacing="3">WHAT IS DONE, AND WHAT COMES NEXT</text>
  <text x="44" y="210" class="ti" font-size="72" fill="#1E2B45">The MVP</text>

  <!-- ===== Card 1: Done ===== -->
  <rect x="44" y="240" width="586" height="694" rx="18" fill="#1F4E7E"/>
  <rect x="44" y="240" width="586" height="12" rx="6" fill="#A9C4E4"/>
  <rect x="82" y="276" width="140" height="40" rx="20" fill="#3E6B9A"/>
  <text x="152" y="303" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" letter-spacing="3">✓  DONE</text>
  <text x="84" y="380" class="ti" font-size="46" fill="#FFFFFF">Built and running</text>
  <line x1="84" y1="412" x2="590" y2="412" stroke="#4B79A8"/>
  <g class="dw">
    <text x="84" y="446">✓</text><text x="124" y="446">Upload a discharge letter, and it becomes a</text><text x="124" y="472">plan she can talk to</text>
    <line x1="84" y1="490" x2="590" y2="490" stroke="#4B79A8"/>
    <text x="84" y="520">✓</text><text x="124" y="520">Answers quoted from her own letter,</text><text x="124" y="546">with the page they came from</text>
    <line x1="84" y1="564" x2="590" y2="564" stroke="#4B79A8"/>
    <text x="84" y="594">✓</text><text x="124" y="594">A safety gate (our open-source package)</text><text x="124" y="620">flags unclear items for a person to confirm</text>
    <line x1="84" y1="638" x2="590" y2="638" stroke="#4B79A8"/>
    <text x="84" y="668">✓</text><text x="124" y="668">A crisis check that replies safely</text><text x="124" y="694">before any AI runs</text>
    <line x1="84" y1="712" x2="590" y2="712" stroke="#4B79A8"/>
    <text x="84" y="742">✓</text><text x="124" y="742">Nine MCP tools, two prompts and an MCP</text><text x="124" y="768">App on spec 2025-11-25</text>
    <line x1="84" y1="786" x2="590" y2="786" stroke="#4B79A8"/>
    <text x="84" y="816">✓</text><text x="124" y="816">Proactive voice reminders, scheduled by</text><text x="124" y="842">Amazon EventBridge</text>
    <line x1="84" y1="860" x2="590" y2="860" stroke="#4B79A8"/>
    <text x="84" y="890">✓</text><text x="124" y="890">A classic Alexa skill and a web voice client,</text><text x="124" y="916">with a text fallback</text>
  </g>

  <!-- ===== Card 2: Simulated ===== -->
  <rect x="664" y="240" width="586" height="694" rx="18" fill="#FFF9EE" stroke="#EADBC0" stroke-width="2"/>
  <rect x="664" y="240" width="586" height="12" rx="6" fill="#B7791F"/>
  <rect x="702" y="276" width="196" height="40" rx="20" fill="#F7E3BF"/>
  <circle cx="726" cy="296" r="6" fill="none" stroke="#B7791F" stroke-width="2.5"/>
  <text x="746" y="303" fill="#8A5A12" font-size="16" font-weight="700" letter-spacing="3">SIMULATED</text>
  <text x="704" y="380" class="ti" font-size="46" fill="#1E2B45">Simulated or synthetic</text>
  <line x1="704" y1="412" x2="1210" y2="412" stroke="#EADBC0"/>
  <g class="sm">
    <circle cx="712" cy="439" r="6" fill="none" stroke="#B7791F" stroke-width="2.5"/>
    <text x="744" y="446">Alexa+ is simulated in a web app; the Alexa</text><text x="744" y="472">skill runs in Amazon's simulator</text>
    <line x1="704" y1="490" x2="1210" y2="490" stroke="#EADBC0"/>
    <circle cx="712" cy="513" r="6" fill="none" stroke="#B7791F" stroke-width="2.5"/>
    <text x="744" y="520">Every discharge letter is synthetic</text>
    <line x1="704" y1="538" x2="1210" y2="538" stroke="#EADBC0"/>
    <circle cx="712" cy="561" r="6" fill="none" stroke="#B7791F" stroke-width="2.5"/>
    <text x="744" y="568">One shared demo patient, Margaret</text>
    <line x1="704" y1="586" x2="1210" y2="586" stroke="#EADBC0"/>
    <circle cx="712" cy="609" r="6" fill="none" stroke="#B7791F" stroke-width="2.5"/>
    <text x="744" y="616">The demo clock is fixed to 23 October</text><text x="744" y="642">for the recording</text>
  </g>

  <!-- ===== Card 3: Next ===== -->
  <rect x="1284" y="240" width="592" height="694" rx="18" fill="#FFFFFF" stroke="#A3204A" stroke-width="3"/>
  <rect x="1284" y="240" width="592" height="12" rx="6" fill="#A3204A"/>
  <rect x="1322" y="276" width="220" height="40" rx="20" fill="#A3204A"/>
  <text x="1432" y="303" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" letter-spacing="3">→  NEXT PHASE</text>
  <text x="1324" y="380" class="ti" font-size="46" fill="#1E2B45">What comes next</text>
  <line x1="1324" y1="412" x2="1836" y2="412" stroke="#E9DCE1"/>
  <g class="nx">
    <text x="1326" y="448" fill="#A3204A">→</text><text x="1362" y="448">Secure sign-in and patient consent</text>
    <line x1="1324" y1="468" x2="1836" y2="468" stroke="#E9DCE1"/>
    <text x="1326" y="495" fill="#A3204A">→</text><text x="1362" y="495">Reminder times she chooses when her letter</text>
    <text x="1362" y="520">gives none (the letter stays in charge)</text>
    <line x1="1324" y1="540" x2="1836" y2="540" stroke="#E9DCE1"/>
    <text x="1326" y="567" fill="#A3204A">→</text><text x="1362" y="567">Unclear instructions sent to her care team</text>
    <line x1="1324" y1="587" x2="1836" y2="587" stroke="#E9DCE1"/>
    <text x="1326" y="614" fill="#A3204A">→</text><text x="1362" y="614">Daily progress reports for family and care team</text>
    <line x1="1324" y1="634" x2="1836" y2="634" stroke="#E9DCE1"/>
    <text x="1326" y="661" fill="#A3204A">→</text><text x="1362" y="661">One-step calling to emergency services or her carer</text>
    <line x1="1324" y1="681" x2="1836" y2="681" stroke="#E9DCE1"/>
    <text x="1326" y="708" fill="#A3204A">→</text><text x="1362" y="708">Photo letters, and voice in her own language</text>
    <line x1="1324" y1="728" x2="1836" y2="728" stroke="#E9DCE1"/>
    <text x="1326" y="755" fill="#A3204A">→</text><text x="1362" y="755">Integration with hospital systems</text>
    <line x1="1324" y1="775" x2="1836" y2="775" stroke="#E9DCE1"/>
    <text x="1326" y="802" fill="#A3204A">→</text><text x="1362" y="802">Clinical pilot before any real patient</text>
    <text x="1324" y="863" font-size="16.5" font-style="italic" fill="#6A625C">Order to be checked with patients, carers and nurses</text>
  </g>

  <!-- Bottom line -->
  <text x="44" y="984" font-size="25" fill="#4A423C"><tspan font-weight="700" fill="#1F4E7E">AfterWard is a proactive voice companion.</tspan> Amazon EventBridge starts each reminder before it is due, so she never has to ask.</text>

  <!-- Footer -->
  <rect y="1016" width="1920" height="64" fill="#A3204A"/>
  <text x="44" y="1056" fill="#FFFFFF" font-size="19" font-weight="700">AfterWard · A living recovery plan for Alexa+</text>
  <text x="1876" y="1056" text-anchor="end" fill="#F2C14E" font-size="19" font-weight="700">Synthetic patient data · Simulated Alexa+</text>
</svg>
