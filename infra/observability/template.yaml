AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AfterWard observability: alarms on the metrics the app writes in its log lines
  (CloudWatch Embedded Metric Format), SNS notifications, and saved Logs Insights
  queries. Log groups are administrator-managed. Deployment unverified. See docs/observability.md.

Parameters:
  McpLoadBalancerFullName:
    Type: String
    AllowedPattern: '^app/[A-Za-z0-9-]+/[a-f0-9]+$'
    Description: Existing MCP ALB full name (app/name/id), not its ARN or DNS name.
  McpTargetGroupFullName:
    Type: String
    AllowedPattern: '^targetgroup/[A-Za-z0-9-]+/[a-f0-9]+$'
    Description: Existing MCP target group full name (targetgroup/name/id), not its ARN.
  ToolErrorThreshold:
    Type: Number
    Default: 3
    Description: Alarm when MCP tool errors in 5 minutes are more than this.
  DeadLetterQueueName:
    Type: String
    Default: AfterWardDocumentProcessingDLQ
    Description: The document queue's dead-letter queue.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional. An address to email when an alarm fires.
  McpLogGroupName:
    Type: String
    Default: /ecs/afterward-mcp
    Description: Existing administrator-created MCP log group with 30-day retention.
  QueryLogGroups:
    Type: CommaDelimitedList
    Default: /aws/lambda/AfterWardDocumentProcessor,/aws/lambda/AfterwardReminderChecker
    Description: >
      Additional existing log groups the saved queries search. The MCP log group
      is added automatically. Include the bridge group only if it already exists.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: afterward-alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAfterWardCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn:
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:afterward-tool-errors'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:afterward-document-dlq-not-empty'
                  - !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:afterward-mcp-no-healthy-targets'

  # tool_errors is written by app/mcp/server.py: 1 when a tool raises, 0 otherwise.
  # An expected "no" from a tool (nothing to undo, no evidence) is not an error.
  ToolErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: afterward-tool-errors
      AlarmDescription: MCP tool calls are failing. Search the logs for event = "tool_call" and status = "error".
      Namespace: AfterWard
      MetricName: tool_errors
      Dimensions:
        - Name: service
          Value: mcp
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ToolErrorThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Any message here is a letter that failed every retry.
  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: afterward-document-dlq-not-empty
      AlarmDescription: A discharge letter failed processing and is in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Ref DeadLetterQueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Unlike UnHealthyHostCount, this also alarms when every target is deregistered
  # and health metrics stop. This does not require Container Insights or a canary.
  McpAvailabilityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: afterward-mcp-no-healthy-targets
      AlarmDescription: MCP ALB has fewer than one healthy target or missing health metrics. Check ECS and target health; this is not an end-to-end MCP probe.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref McpLoadBalancerFullName
        - Name: TargetGroup
          Value: !Ref McpTargetGroupFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]

  TraceOneRequestQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: AfterWard/Trace one request
      LogGroupNames: !Split [',', !Join [',', [!Join [',', !Ref QueryLogGroups], !Ref McpLogGroupName]]]
      QueryString: |
        fields @timestamp, service, event, route, tool, kind, status, ms, reason, error_type, error_code
        | filter request_id = "PASTE_REQUEST_ID_HERE"
        | sort @timestamp asc

  ChatTimeQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: AfterWard/Chat time p50 and p90
      LogGroupNames: !Split [',', !Join [',', [!Join [',', !Ref QueryLogGroups], !Ref McpLogGroupName]]]
      QueryString: |
        filter event = "agent_turn"
        | stats count() as turns, pct(ms, 50) as p50_ms, pct(ms, 90) as p90_ms by bin(1h), kind

  UploadToReadyQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: AfterWard/Upload to ready time
      LogGroupNames: !Split [',', !Join [',', [!Join [',', !Ref QueryLogGroups], !Ref McpLogGroupName]]]
      QueryString: |
        filter event = "ingest_ready"
        | stats count() as uploads, pct(upload_to_ready_ms, 50) as p50_ms, pct(upload_to_ready_ms, 90) as p90_ms, max(upload_to_ready_ms) as slowest_ms by bin(1d)

Outputs:
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  McpLogGroupName:
    Value: !Ref McpLogGroupName
