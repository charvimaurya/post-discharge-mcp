AWSTemplateFormatVersion: '2010-09-09'
Description: AfterWard bridge on Fargate. Prepared only; does not alter the MCP service.
Parameters:
  ClusterArn:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AllowedIngressCidr:
    Type: String
    Description: Trusted frontend egress CIDR. Do not use unrestricted ingress for a private demo.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
  CertificateArn:
    Type: String
    AllowedPattern: 'arn:aws:acm:.*:certificate/.*'
  ImageUri:
    Type: String
    AllowedPattern: '.+@sha256:[a-f0-9]{64}'
    Description: Immutable linux/amd64 ECR image digest.
  EcrRepositoryName:
    Type: String
    Default: afterward-bridge
  BridgeKeySecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:.*:secret:.*'
  McpTokenSecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:.*:secret:.*'
  SecretKmsKeyArn:
    Type: String
    Default: ''
    Description: Optional customer-managed key used by both secrets; blank for the AWS-managed key.
  McpUrl:
    Type: String
    AllowedPattern: 'https://.+'
  McpClientOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Must match the existing MCP server's allowed origins; this is not visitor authentication.
  AgentModelId:
    Type: String
    Default: eu.anthropic.claude-haiku-4-5-20251001-v1:0
  AgentFoundationModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Must match AgentModelId's underlying model.
  RecoveryStateTable:
    Type: String
    Default: PostDischargeRecoveryState
  EventHistoryTable:
    Type: String
    Default: PostDischargeEventHistory
Conditions:
  HasSecretKmsKey: !Not [!Equals [!Ref SecretKmsKeyArn, '']]
Resources:
  BridgeLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 30
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from the trusted frontend only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8002
          ToPort: 8002
          DestinationSecurityGroupId: !GetAtt TaskSecurityGroup.GroupId
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bridge task; inbound granted separately from its ALB
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  TaskIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt TaskSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8002
      ToPort: 8002
      SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!GetAtt AlbSecurityGroup.GroupId]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: idle_timeout.timeout_seconds
          Value: '120'
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8002
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /bridge/health
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnLike: {aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'}
      Policies:
        - PolicyName: PullImageAndInjectBridgeKey
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BridgeLogs.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref BridgeKeySecretArn
              - !If
                - HasSecretKmsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref SecretKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                      kms:EncryptionContext:SecretARN: !Ref BridgeKeySecretArn
                - !Ref AWS::NoValue
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnLike: {aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'}
      Policies:
        - PolicyName: BridgeRuntimeOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RecoveryStateTable}'
                Condition:
                  ForAllValues:StringEquals: {dynamodb:LeadingKeys: [demo_patient_001]}
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:BatchWriteItem]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EventHistoryTable}'
                Condition:
                  ForAllValues:StringEquals: {dynamodb:LeadingKeys: [demo_patient_001]}
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref McpTokenSecretArn
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${AgentModelId}'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/${AgentFoundationModelId}'
              - !If
                - HasSecretKmsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref SecretKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                      kms:EncryptionContext:SecretARN: !Ref McpTokenSecretArn
                - !Ref AWS::NoValue
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: afterward-bridge
          Image: !Ref ImageUri
          Essential: true
          User: '10001:10001'
          ReadonlyRootFilesystem: true
          LinuxParameters: {InitProcessEnabled: true}
          PortMappings: [{ContainerPort: 8002, Protocol: tcp}]
          Environment:
            - {Name: AWS_REGION, Value: !Ref 'AWS::Region'}
            - {Name: CLOCK_MODE, Value: production}
            - {Name: LOCAL_REMINDER_LOOP, Value: '0'}
            - {Name: MODEL_MODE, Value: final}
            - {Name: FINAL_AGENT_MODEL_ID, Value: !Ref AgentModelId}
            - {Name: MCP_URL, Value: !Ref McpUrl}
            - {Name: MCP_CLIENT_ORIGIN, Value: !Ref McpClientOrigin}
            - {Name: MCP_AUTH_TOKEN_SECRET_ARN, Value: !Ref McpTokenSecretArn}
            - {Name: RECOVERY_STATE_TABLE, Value: !Ref RecoveryStateTable}
            - {Name: EVENT_HISTORY_TABLE, Value: !Ref EventHistoryTable}
          Secrets:
            - {Name: BRIDGE_KEY, ValueFrom: !Ref BridgeKeySecretArn}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BridgeLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: bridge
          HealthCheck:
            Command: [CMD, python, '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/bridge/health', timeout=3)"]
            Interval: 30
            Timeout: 5
            StartPeriod: 30
            Retries: 3
  Service:
    Type: AWS::ECS::Service
    DependsOn: [Listener, TaskIngress]
    Properties:
      Cluster: !Ref ClusterArn
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!GetAtt TaskSecurityGroup.GroupId]
      LoadBalancers:
        - ContainerName: afterward-bridge
          ContainerPort: 8002
          TargetGroupArn: !Ref TargetGroup
Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  LogGroup:
    Value: !Ref BridgeLogs
