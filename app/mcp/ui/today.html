<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AfterWard: Today</title>
<style>
  /* Colours and font stacks copied from web/app/demo/afterward.css. Fonts are named, never
     downloaded: an MCP App runs sandboxed, so it makes no outside requests. */
  :root {
    --bg:#FAF7F2; --ink:#17222B; --soft:#4D5863; --muted:#8B95A0;
    --accent:#B3264F; --accent-pale:#FBE9EE;
    --card:#FFFFFF; --line:#E9E2D6; --alt:#F4EFE6;
    --blue:#1F5E8C; --blue-pale:#E8F0F6; --amber:#7A4E00; --amber-pale:#FFF1CF;
    --serif:'Source Serif 4',Georgia,serif; --sans:'IBM Plex Sans',Arial,sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px;
          box-shadow: 0 1px 2px rgba(23,34,43,.05), 0 14px 36px rgba(23,34,43,.07); max-width: 560px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; letter-spacing: -.4px; margin: 4px 0 14px; }
  .waiting { font-family: var(--serif); font-size: 19px; color: var(--soft); padding: 8px 0; }
  .progress { margin-bottom: 16px; }
  .progress .label { font-size: 15px; font-weight: 600; margin-bottom: 7px; }
  .bar { height: 10px; border-radius: 999px; background: var(--alt); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 999px; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  li { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
  li.done { background: var(--alt); color: var(--soft); }
  li.next { border: 2px solid var(--accent); background: var(--accent-pale); }
  .tick { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center;
          font-size: 13px; font-weight: 700; color: #fff; margin-top: 1px; }
  li.done .tick { background: var(--blue); border-color: var(--blue); }
  .body { flex: 1; min-width: 0; }
  .what { font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .when { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .chip.next { background: var(--accent); color: #fff; }
  .chip.confirm { background: var(--amber-pale); color: var(--amber); }
  .note { font-size: 14px; color: var(--soft); }
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="eyebrow">AfterWard</div>
  <h1>Today</h1>
  <div id="view"><p class="waiting">Waiting for today's plan…</p></div>
</main>
<script>
(function () {
  "use strict";

  // MCP Apps (spec 2026-01-26): JSON-RPC 2.0 over postMessage with the host window.
  var PROTOCOL_VERSION = "2026-01-26";
  var host = window.parent;
  var nextId = 1;
  var initId = null;
  var view = document.getElementById("view");

  function send(message) {
    host.postMessage(Object.assign({ jsonrpc: "2.0" }, message), "*");
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);  // text only, so letter wording can never become markup
    return node;
  }

  function show(nodes) {
    view.replaceChildren.apply(view, nodes);
  }

  function message(text) {
    show([el("p", "note", text)]);
  }

  // The tool returns a plain dict, so the SDK sends it as JSON text in content[0].text.
  // structuredContent is used first in case a host or SDK supplies it.
  function readResult(params) {
    if (params && params.structuredContent && typeof params.structuredContent === "object") {
      return params.structuredContent;
    }
    var content = params && Array.isArray(params.content) ? params.content : [];
    for (var i = 0; i < content.length; i++) {
      if (content[i] && content[i].type === "text" && typeof content[i].text === "string") {
        return JSON.parse(content[i].text);
      }
    }
    return null;
  }

  function timeOf(iso) {
    var date = new Date(iso);
    if (isNaN(date.getTime())) return "";
    return date.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }

  function prettyDate(text) {
    var date = new Date(String(text) + "T12:00:00");
    if (isNaN(date.getTime())) return "";
    return date.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  }

  function label(task) {
    var name = task.description || task.name || "Recovery task";
    if (Number(task.occurrence_total) > 1) name += " (" + task.occurrence_number + " of " + task.occurrence_total + ")";
    return name;
  }

  function order(a, b) {
    var ta = a.clock_time || "99:99", tb = b.clock_time || "99:99";
    if (ta !== tb) return ta < tb ? -1 : 1;
    return (Number(a.occurrence_number) || 0) - (Number(b.occurrence_number) || 0);
  }

  function draw(result) {
    if (!result || result.ok !== true || !result.data) {
      message("Could not read today's plan.");
      return;
    }
    var tasks = (Array.isArray(result.data.tasks) ? result.data.tasks : []).slice().sort(order);
    var nodes = [];
    var when = prettyDate(result.data.date);
    if (when) document.querySelector(".eyebrow").textContent = "AfterWard · " + when;

    if (!tasks.length) {
      message("Nothing is scheduled for today.");
      return;
    }

    var done = tasks.filter(function (t) { return t.status === "completed"; }).length;
    var progress = el("div", "progress");
    progress.appendChild(el("div", "label", done + " of " + tasks.length + " done"));
    var bar = el("div", "bar");
    bar.setAttribute("role", "progressbar");
    bar.setAttribute("aria-valuemin", "0");
    bar.setAttribute("aria-valuemax", String(tasks.length));
    bar.setAttribute("aria-valuenow", String(done));
    var fill = el("i");
    fill.style.width = Math.round((done / tasks.length) * 100) + "%";
    bar.appendChild(fill);
    progress.appendChild(bar);
    nodes.push(progress);

    var list = el("ul");
    var nextMarked = false;
    tasks.forEach(function (task) {
      var isDone = task.status === "completed";
      var isNext = !isDone && !nextMarked;
      if (isNext) nextMarked = true;

      var item = el("li", isDone ? "done" : isNext ? "next" : "");
      item.appendChild(el("span", "tick", isDone ? "✓" : ""));
      var body = el("div", "body");
      body.appendChild(el("div", "what", label(task)));

      var at = isDone && task.completed_at ? "Done at " + timeOf(task.completed_at)
        : task.clock_time || task.time_of_day_label || "";
      if (at) body.appendChild(el("div", "when", at));

      var chips = el("div", "chips");
      if (isNext) chips.appendChild(el("span", "chip next", "Next"));
      if (task.needs_confirmation === true) chips.appendChild(el("span", "chip confirm", "Needs confirmation"));
      if (chips.childNodes.length) body.appendChild(chips);

      item.appendChild(body);
      list.appendChild(item);
    });
    nodes.push(list);
    show(nodes);
  }

  window.addEventListener("message", function (event) {
    if (event.source !== host) return;  // only the host that embeds this view
    var msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;

    if (msg.id === initId && (msg.result || msg.error)) {
      send({ method: "ui/notifications/initialized", params: {} });
      return;
    }
    if (msg.method === "ui/notifications/tool-result") {
      try { draw(readResult(msg.params)); }
      catch (error) { message("Could not read today's plan."); }
    }
    // ui/notifications/tool-input carries no arguments for this tool, so it is ignored.
  });

  initId = nextId++;
  send({
    id: initId,
    method: "ui/initialize",
    params: {
      protocolVersion: PROTOCOL_VERSION,
      appInfo: { name: "AfterWard Today", version: "0.1.0" },
      appCapabilities: {}
    }
  });
})();
</script>
</body>
</html>
