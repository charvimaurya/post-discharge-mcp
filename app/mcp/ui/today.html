<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AfterWard · Today</title>
  <style>
    :root{color-scheme:light;--bg:#FAF7F2;--ink:#17222B;--soft:#4D5863;--accent:#B3264F;--line:#E9E2D6;--blue:#1F5E8C;--amber:#7A4E00;--serif:'Source Serif 4',Georgia,serif;--sans:'IBM Plex Sans',Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45}
    main{max-width:760px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 1px 2px #17222b0d,0 14px 36px #17222b12}
    header{display:flex;align-items:end;justify-content:space-between;gap:16px}.brand{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);font-weight:600}
    h1{font-family:var(--serif);font-size:38px;line-height:1.1;margin:6px 0 0;font-weight:600;letter-spacing:-.6px}#count{font-family:var(--serif);font-size:24px;margin:0;text-align:right}
    progress{display:block;width:100%;height:10px;border:0;border-radius:99px;overflow:hidden;margin:20px 0;background:#F4EFE6;accent-color:var(--blue)}
    progress::-webkit-progress-bar{background:#F4EFE6}progress::-webkit-progress-value{background:var(--blue);border-radius:99px}progress::-moz-progress-bar{background:var(--blue)}
    #message{color:var(--soft);margin:20px 0 0}ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:12px}
    .item{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:18px;overflow-wrap:anywhere}.item.done{background:#F5F9FC;border-color:#CFE0EC}.item.next{border-color:#B3264F;background:linear-gradient(90deg,#FFF7F9,#fff)}
    .icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:#F4EFE6;font-size:22px}.done .icon{background:var(--blue);color:white}.next .icon{background:#FBE9EE;color:var(--accent)}
    .body{min-width:0;flex:1}h2{font-size:21px;line-height:1.3;margin:0;font-weight:600}.detail,.state{font-size:16px;color:var(--soft);margin:5px 0 0}.done .state{color:var(--blue);font-weight:600}
    .next-label{color:var(--accent);font-size:12px;text-transform:uppercase;font-weight:700;letter-spacing:1.2px;margin:0 0 6px}.confirmation{display:inline-block;border-radius:99px;padding:3px 11px;background:#FFF1CF;color:var(--amber);font-size:14px;font-weight:600;margin-top:8px}
    [hidden]{display:none!important}@media(max-width:440px){body{padding:10px}main{padding:18px}header{align-items:start}h1{font-size:34px}#count{font-size:20px}.item{padding:12px;gap:10px}h2{font-size:19px}}
  </style>
</head>
<body>
<main aria-labelledby="heading">
  <header><div><div class="brand">AfterWard · At home</div><h1 id="heading">Today</h1></div><p id="count" hidden></p></header>
  <progress id="progress" max="1" value="0" aria-label="Completed tasks" hidden></progress>
  <p id="message" role="status" aria-live="polite">Waiting for today's plan</p>
  <ul id="tasks" aria-label="Today's recovery tasks"></ul>
</main>
<script>
(() => {
  'use strict';
  // MCP Apps 2026-01-26: https://github.com/modelcontextprotocol/ext-apps/blob/main/specification/2026-01-26/apps.mdx
  // Handshake fields: https://github.com/modelcontextprotocol/ext-apps/blob/main/src/spec.types.ts
  const version = '2026-01-26';
  const initId = 'afterward-today-initialize';
  const parent = window.parent;
  const embedded = parent !== window;
  const message = document.getElementById('message');
  const list = document.getElementById('tasks');
  const count = document.getElementById('count');
  const progress = document.getElementById('progress');
  let ready = false;
  let origin = '*'; // Sandbox origins are host-dependent; pin after the parent's handshake.
  let hostContext = {};
  let observer;
  const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  const text = value => typeof value === 'string' ? value.trim() : '';
  const send = data => parent.postMessage({jsonrpc: '2.0', ...data}, origin);
  function sizeChanged() {
    if (ready) send({method: 'ui/notifications/size-changed', params: {width: document.documentElement.clientWidth, height: document.documentElement.scrollHeight}});
  }
  function unavailable() {
    list.replaceChildren();
    count.hidden = progress.hidden = true;
    message.hidden = false;
    message.textContent = "Today's plan is unavailable. Please ask for today's tasks again.";
    sizeChanged();
  }
  function payload(result) {
    if (!object(result) || result.isError === true) return null;
    // Prefer structuredContent where supplied; this tool's SDK currently sends JSON text.
    if (object(result.structuredContent)) return result.structuredContent;
    for (const block of Array.isArray(result.content) ? result.content : []) {
      if (!object(block) || block.type !== 'text' || typeof block.text !== 'string') continue;
      try { const value = JSON.parse(block.text); if (object(value)) return value; } catch { /* Not a JSON result. */ }
    }
    return null;
  }
  function append(parentNode, tag, value, className) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    element.textContent = value;
    parentNode.append(element);
    return element;
  }
  function sortTime(task) {
    const clock = text(task.clock_time).match(/^([01]\d|2[0-3]):([0-5]\d)$/);
    if (clock) return Number(clock[1]) * 60 + Number(clock[2]);
    return ({morning: 540, midday: 720, afternoon: 900, evening: 1080, night: 1260})[text(task.time_of_day_label).toLowerCase()] ?? 1440;
  }
  function completionTime(value) {
    const stamp = text(value);
    if (/^([01]\d|2[0-3]):[0-5]\d$/.test(stamp)) return stamp;
    // Only parse zoned timestamps: do not silently invent a timezone.
    if (!/^\d{4}-\d\d-\d\dT\d\d:\d\d.*(?:Z|[+-]\d\d:\d\d)$/.test(stamp)) return '';
    const date = new Date(stamp);
    if (!Number.isFinite(date.getTime())) return '';
    try {
      if (text(hostContext.timeZone)) return new Intl.DateTimeFormat('en-GB', {hour: '2-digit', minute: '2-digit', timeZone: hostContext.timeZone}).format(date);
    } catch { /* Invalid host timezone: show the supplied timestamp unchanged. */ }
    return stamp;
  }
  function render(result) {
    const value = payload(result);
    if (!object(value) || value.ok !== true || !object(value.data) || !Array.isArray(value.data.tasks) || value.data.tasks.some(task => !object(task))) {
      unavailable(); return;
    }
    const tasks = [...value.data.tasks].sort((a, b) => sortTime(a) - sortTime(b));
    const done = tasks.filter(task => task.status === 'completed').length;
    const next = tasks.find(task => task.status === 'pending' && task.needs_confirmation !== true);
    count.textContent = `${done} of ${tasks.length} done`;
    count.hidden = progress.hidden = false;
    progress.max = Math.max(tasks.length, 1);
    progress.value = done;
    progress.setAttribute('aria-valuetext', `${done} of ${tasks.length} tasks completed`);
    message.hidden = tasks.length > 0;
    message.textContent = tasks.length ? '' : 'No recovery tasks are scheduled for today.';
    list.replaceChildren();
    // Like the existing Today screen, completed tasks come first.
    for (const task of [...tasks.filter(t => t.status === 'completed'), ...tasks.filter(t => t.status !== 'completed')]) {
      const completed = task.status === 'completed';
      const row = document.createElement('li');
      row.className = `item${completed ? ' done' : task === next ? ' next' : ''}`;
      append(row, 'span', completed ? '✓' : '○', 'icon').setAttribute('aria-hidden', 'true');
      const body = document.createElement('div'); body.className = 'body'; row.append(body);
      if (task === next) append(body, 'p', 'Next up', 'next-label');
      let title = text(task.description) || text(task.name) || text(task.title) || 'Recovery task';
      if (Number.isInteger(task.occurrence_total) && task.occurrence_total > 1 && Number.isInteger(task.occurrence_number)) title += ` (${task.occurrence_number} of ${task.occurrence_total})`;
      append(body, 'h2', title);
      const detail = [text(task.clock_time) || text(task.time_of_day_label), text(task.details) || text(task.instructions)].filter(Boolean).join(' · ');
      if (detail) append(body, 'p', detail, 'detail');
      const at = completed ? completionTime(task.completed_at) : '';
      append(body, 'p', completed ? `Done${at ? ` at ${at}` : ''}` : task.status === 'pending' ? 'Pending' : 'Status unavailable', 'state');
      if (task.needs_confirmation === true) append(body, 'span', 'Needs confirmation', 'confirmation');
      list.append(row);
    }
    sizeChanged();
  }
  function receive(event) {
    if (!embedded || event.source !== parent || (origin !== '*' && event.origin !== origin)) return;
    const data = event.data;
    if (!object(data) || data.jsonrpc !== '2.0') return;
    if (!ready && data.id === initId && !data.method) {
      if (data.error || !object(data.result) || data.result.protocolVersion !== version) { unavailable(); return; }
      if (event.origin && event.origin !== 'null') origin = event.origin;
      hostContext = object(data.result.hostContext) ? data.result.hostContext : {};
      ready = true;
      send({method: 'ui/notifications/initialized', params: {}});
      sizeChanged();
      return;
    }
    if (!ready) return;
    if (data.method === 'ui/notifications/tool-result') render(data.params);
    else if (data.method === 'ui/notifications/tool-cancelled') unavailable();
    else if (data.method === 'ping' && data.id !== undefined) send({id: data.id, result: {}});
    else if (data.method === 'ui/resource-teardown' && data.id !== undefined) {
      send({id: data.id, result: {}});
      ready = false;
      observer?.disconnect();
      window.removeEventListener('message', receive);
    }
  }
  if (embedded) {
    window.addEventListener('message', receive);
    if (typeof ResizeObserver !== 'undefined') { observer = new ResizeObserver(sizeChanged); observer.observe(document.body); }
    send({id: initId, method: 'ui/initialize', params: {appInfo: {name: 'AfterWard Today', version: '1.0.0'}, appCapabilities: {availableDisplayModes: ['inline']}, protocolVersion: version}});
  }
})();
</script>
</body>
</html>
